packages:
  - apps/*
  - packages/*
  - services/*
allowBuilds:
  # Vite requires esbuild's verified platform binary during the desktop build.
  esbuild: true
  # Necessários para a criação dos instaladores distribuídos pelo GitHub Actions.
  core-js: true
  electron-winstaller: true
minimumReleaseAgeExclude:
  - electron@45.2.1
